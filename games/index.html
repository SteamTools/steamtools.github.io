<!DOCTYPE HTML>
<html lang="en-US" ng-app="Steam">
<head>
	<!-- NetworkN -->
	<script async src="https://kumo.network-n.com/dist/app.js" site="steam-tools"></script>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="See the intersection of your Steam games with someone else's, and filter them by categories.">
	<meta name="keywords" content="Steam,games,filter,compare,intersection">
	<meta name="author" content="Ehsan Kia">
	<title>Game Filter</title>

	<script src="//ajax.googleapis.com/ajax/libs/jquery/1.8.0/jquery.min.js"></script>
	<script src="jquery.mCustomScrollbar.concat.min.js"></script>
	<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.0.7/angular.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/2.3.2/js/bootstrap.min.js"></script>

	<link rel="shortcut icon" href="/favicon.ico">
	<link href="//netdna.bootstrapcdn.com/twitter-bootstrap/2.3.2/css/bootstrap-combined.min.css" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="jquery.mCustomScrollbar.css" media="all">
	<link rel="stylesheet" type="text/css" href="../css/steamtools-import.css?v=20261116c" media="all">
	<link rel="stylesheet" type="text/css" href="style.css?v=20261116b" media="all">
</head>
<body ng-controller="SteamCtrl" ng-cloak>
	<a class="corner topbutton" style="left: 25px;" href="../">&laquo; Hub</a>
	<div class="corner" style="right: 25px;">
		<a target="_blank" href="https://twitter.com/SteamTools"><img src="/img/twitter.png" alt="Twitter" width="25" height="25"></a>
		<a target="_blank" href="https://steamcommunity.com/groups/steam_tools"><img src="/img/steam.png" alt="Steam Group" width="25" height="25"></a>
		<a class="topbutton" id="feedback"  href="https://steamcommunity.com/groups/steam_tools">Feedback</a>
		<a class="topbutton" id="donate" href="https://www.paypal.com/donate/?business=HLRYRKCXRYX7C">PayPal</a>
	</div>

	<div id="nn_lb1" style="margin: 0px auto; text-align: center;"></div>

	<div id="container">
		<div id="user-selection">
			<div style="margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;">
				<a ng-href="[[steamLoginUrl]]" ng-show="!loggedIn"><img src="/img/steam_openid.png" alt="Sign in through Steam" width="114" height="43"></a>
				<button type="button" class="btn btn-mini" ng-show="loggedIn" ng-click="userLogout()">Logout</button>
			</div>
			<button type="button" class="st-icon-btn left" ng-click="deleteUsers()" aria-label="Remove selected users">
				<i class="icon-trash icon-white" aria-hidden="true" rel="tooltip" data-placement="left" data-original-title="Remove selected"></i>
			</button>
			<form id="addinput" class="input-prepend input-append form-horizontal" ng-submit="addUser()">
				<label for="games-steamid" class="add-on" style="display:inline-block;margin-bottom:0;">SteamID</label>
				<input id="games-steamid" style="width: min(250px, 100%);" type="text" ng-model="UserID" autocorrect="off" autocapitalize="none" spellcheck="false">
				<button type="submit" class="btn"><i class="icon-user" aria-hidden="true"></i> Add User</button>
			</form>
			<div ng-show="userError" role="status" aria-live="polite" style="color:#f88; font-size:12px; margin:4px 0;">[[userError]]</div>
			<span class="right" title="This tool allows you to see the intersection of your and your friends' games, and filter them using flags. Red border means profile is private.">
				<i style="margin-top: -10px" class="icon-info-sign icon-white" rel="tooltip" data-placement="right"
				data-original-title="This tool allows you to see the intersection of your and your friends' games, and filter them using flags. Red border means profile is private." aria-hidden="true"></i>
			</span>
			<ul>
				<li class="user [[userSelected(user.steamid)]] [[isPrivate(user.steamid)]]" ng-repeat="user in Users" fadey="500" draggable="true" ng-click="selectUser(user.steamid)">
					<button type="button" class="st-icon-btn left" ng-click="$event.stopPropagation(); showFriends(user.steamid,user.name)" aria-label="Friends list for [[user.name]]"><i class="icon-list" aria-hidden="true" rel="tooltip" data-placement="top" data-original-title="Friends list"></i></button>
					<p class="left name">[[user.name]]</p>
					<button type="button" class="st-icon-btn right" ng-click="$event.stopPropagation(); removeUser(user.steamid)" aria-label="Remove [[user.name]]"><i class="icon-remove" aria-hidden="true" rel="tooltip" data-placement="top" data-original-title="Remove"></i></button>
					<img ng-src="[[user.avatar]]" alt="[[user.name]]'s Avatar" width="64" height="64" draggable="false"><br>
				</li>
			</ul>
			<form id="importbtn" class="form-horizontal">
				<button type="button" class="btn" ng-click="importGames()" ng-disabled="selectedUsers.length==0">
					<i class="icon-download" aria-hidden="true"></i> Import Games</button>
			</form>
		</div>

		<div id="filter-panel">
			<div id="filter-title">Flags</div>

			<button type="button" ng-click="f.singleplayer = 1 - (f.singleplayer || 0)" ng-class="{'label-success': f.singleplayer == 1}" aria-pressed="[[f.singleplayer == 1]]" class="label"><i ng-class="f.singleplayer == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Single-Player</button>

			<button type="button" ng-click="f.local_coop = 1 - (f.local_coop || 0)" ng-class="{'label-success': f.local_coop == 1}" aria-pressed="[[f.local_coop == 1]]" class="label"><i ng-class="f.local_coop == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Local Co-op</button>

			<button type="button" ng-click="f.coop = 1 - (f.coop || 0)" ng-class="{'label-success': f.coop == 1}" aria-pressed="[[f.coop == 1]]" class="label"><i ng-class="f.coop == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Co-op</button>

			<button type="button" ng-click="f.multiplayer = 1 - (f.multiplayer || 0)" ng-class="{'label-success': f.multiplayer == 1}" aria-pressed="[[f.multiplayer == 1]]" class="label"><i ng-class="f.multiplayer == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Multi-Player</button>

			<button type="button" ng-click="f.controller = 1 - (f.controller || 0)" ng-class="{'label-success': f.controller == 1}" aria-pressed="[[f.controller == 1]]" class="label"><i ng-class="f.controller == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Controller</button>

			<button type="button" ng-click="f.mac = 1 - (f.mac || 0)" ng-class="{'label-success': f.mac == 1}" aria-pressed="[[f.mac == 1]]" class="label"><i ng-class="f.mac == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Mac</button>

			<button type="button" ng-click="f.linux = 1 - (f.linux || 0)" ng-class="{'label-success': f.linux == 1}" aria-pressed="[[f.linux == 1]]" class="label"><i ng-class="f.linux == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Linux</button>

			<button type="button" ng-click="f.stc = 1 - (f.stc || 0)" ng-class="{'label-success': f.stc == 1}" aria-pressed="[[f.stc == 1]]" class="label"><i ng-class="f.stc == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Trading Cards</button>

			<button type="button" ng-click="f.achievements = 1 - (f.achievements || 0)" ng-class="{'label-success': f.achievements == 1}" aria-pressed="[[f.achievements == 1]]" class="label"><i ng-class="f.achievements == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Achievements</button>

			<button type="button" ng-click="f.workshop = 1 - (f.workshop || 0)" ng-class="{'label-success': f.workshop == 1}" aria-pressed="[[f.workshop == 1]]" class="label"><i ng-class="f.workshop == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Workshop</button>

			<button type="button" ng-click="f.free2play = 1 - (f.free2play || 0)" ng-class="{'label-success': f.free2play == 1}" aria-pressed="[[f.free2play == 1]]" class="label"><i ng-class="f.free2play == 1 && 'icon-check' || 'icon-plus-sign'" aria-hidden="true"></i> Free to Play</button>
		</div>
		<div id="game-list">
			<div id="game-title">Filtered Games ([[gameList.length]])</div>
			<div style="margin: 6px 0;" ng-show="fullGameList.length > 0">
				<label for="games-search" class="st-visually-hidden">Search filtered games</label>
				<input id="games-search" type="text" ng-model="gameSearch" placeholder="Search title..." style="width: 100%; box-sizing: border-box;" autocorrect="off" autocapitalize="none" spellcheck="false">
			</div>
			<ng:switch on="!!(gameStatus==1)">
				<div class="game-text" ng:switch-when="true">Add and select at least one user, then import games.</div>
			</ng:switch>
			<ng:switch on="!!(gameStatus==2)">
				<img ng:switch-when="true" src="img/loading2.gif" alt="Loading games..." width="220" height="19">
			</ng:switch>
			<div id="game-content">
				<a ng-repeat="game in gameList | orderBy:getGameName" adjust-size
					ng-href="https://store.steampowered.com/app/[[game]]" target="_blank">
					<div class="game" draggable="true" ng-bind="gameData[game].name" scrollbar></div>
				</a>
			</div>
				<button ng-show="gameList.length>0" class="btn btn-inverse" ng-click="exportGames()"
					style="margin: 5px 0 -5px 68px;">Export List</button>
		</div>
	</div>
	<dialog id="friendListModal" class="st-friends-dialog" closedby="any" aria-labelledby="myModalLabel">
		<div class="modal-header">
			<button type="button" class="close" ng-click="closeFriendsModal()" aria-label="Close friends dialog">&times;</button>
			<h3 id="myModalLabel">[[selectedName]]'s Friends</h3>
		</div>
		<div class="modal-body nano">
			<ng:switch on="!!(friendStatus==1)">
				<div ng:switch-when="true"> Requesting Friendslist. </div>
			</ng:switch>
			<ng:switch on="!!(friendStatus==2)">
				<div ng:switch-when="true"> No new friends found. </div>
			</ng:switch>
			<ng:switch on="!!(friendStatus==3)">
				<div ng:switch-when="true"> Profile is private. </div>
			</ng:switch>
			<ul>
				<li class="friend [[friendSelected(friend.steamid)]]" ng-repeat="friend in Friends" fadey="500" draggable="true" ng-click="selectFriend(friend.steamid)">
					<p class="left name">[[friend.name]]</p>
					<img ng-src="[[friend.avatar]]" alt="[[friend.name]]'s Avatar" width="64" height="64" draggable="false">
					<br>
				</li>
			</ul>
		</div>
		<div class="modal-footer">
			<button type="button" class="btn" ng-click="closeFriendsModal()">Close</button>
			<button type="button" class="btn btn-primary" ng-click="addFriends()" ng-disabled="selectedFriends.length==0">Add Selected</button>
		</div>
	</dialog>

	<script type="text/javascript" src="../js/steamtools-config.js?v=20261116b"></script>
	<script type="text/javascript" src="steam.js?v=20261116b"></script>

</html>
