<!doctype html>
<html lang="en" ng-app="BGApp">
<head>
	<!-- NetworkN -->
	<script async src="https://kumo.network-n.com/dist/app.js" site="steam-tools"></script>

	<meta charset="UTF-8">
	<meta name="description" content="Easily browse, filter and sort an up to date list of Steam backgrounds in one page.">
	<meta name="keywords" content="Steam,backgrounds,list,sort">
	<meta name="referrer" content="no-referrer-when-downgrade">
	<meta name="author" content="Ehsan Kia">
	<title>Background Gallery</title>
	<link rel="shortcut icon" href="/favicon.ico">
	<link href="//netdna.bootstrapcdn.com/twitter-bootstrap/2.3.2/css/bootstrap-combined.no-icons.min.css" rel="stylesheet">
	<link href="angular.rangeSlider.css?v=20261116b" rel="stylesheet">
	<link href="../css/steamtools-import.css?v=20261116b" rel="stylesheet">

	<style>
		body{text-align: center; padding-top: 10px; background-image: url(/img/bg.png);}
		#items {
			background-color: #222;
			border-radius: 5px;
			margin: auto;
			padding: 5px 0;
			margin-top: 10px;
		}
		.market:hover{ background-color: rgba(200,255,200,0.6); }
		.bg:hover .market { opacity: 1; }
		.bg:hover .name { opacity: 1; }
		img{ transition: opacity 0.3s; }
		.bg{
			position: relative;
			overflow: hidden;
			margin: 5px;
			width: 256px;
			height: 160px;
			display: inline-block;
			vertical-align: top;
			content:' ';
			cursor: pointer;
		}
		.bg-thumb {
			position: absolute;
			left: 0;
			top: 0;
			width: 256px;
			height: 160px;
			object-fit: cover;
			z-index: 0;
		}
		.market {
			position: relative;
			z-index: 2;
			opacity: 0;
			display: block;
			width: 80px;
			height: 28px;
			margin: auto;
			background-color: rgba(255,255,255,0.5);
			transition: opacity 0.2s;
			text-decoration: none;
			font-size: 20px;
			color: #222;
			line-height: 30px;
			margin-top: 120px;
		}

		.name {
			position: relative;
			z-index: 2;
			opacity: 0;
			width: 200px;
			padding: 3px;
			margin-top: 15px;
			transition: opacity 0.2s;
			background-color: rgba(255,255,255,0.5);
			float: left;
			margin-left: 25px;
		}
		dialog.st-bg-lightbox {
			padding: 12px;
			border: 1px solid #444;
			border-radius: 8px;
			background: #14181d;
			color: #fff;
			max-width: min(92vw, 1280px);
			max-height: 92vh;
			margin: auto;
		}
		dialog.st-bg-lightbox[open] {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 8px;
		}
		dialog.st-bg-lightbox:modal {
			overscroll-behavior: contain;
		}
		dialog.st-bg-lightbox::backdrop {
			background: rgba(0, 0, 0, 0.8);
			overflow: hidden;
			overscroll-behavior: contain;
		}
		dialog.st-bg-lightbox img {
			max-width: 100%;
			max-height: calc(92vh - 64px);
			display: block;
		}

		#help {
			width: 675px;
			padding: 8px;
			background-color: #CCC;
			border: 4px double #333;
			margin: auto;
			margin-bottom: 10px;
			font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
			text-align: left;
		}
		#loading {
			width: 200px;
			text-align: center;
			margin: auto;
			font-size: 14pt;
			font-weight: bold;
			color: #333;
			padding: 10px;
		}
		.corner {
			position: absolute;
			opacity: 0.8;
			z-index: 10;
			top: 10px;
		}
		.topbutton {
			color: #159;
			display: inline-block;
			font-weight: bold;
			font-size: 12pt;
			color: #159;
			background-color: #CCC;
			padding: 2px 8px;
			border-radius: 3px;
			box-shadow: 0px 3px 0px 0px #888;
			border: 1px solid #666;
			width: 75px;
			text-align: center;
			margin: 0 3px;
		}
		.slider {
			display: inline-block;
			width: 500px;
			margin-bottom: -7px;
		}
		.limits-label {
			vertical-align: text-bottom;
			margin-left: 3px;
			font-weight: bold;
		}
		.corner img:hover {opacity: 0.8;}
		.topbutton:hover {background-color: #CDE; text-decoration: none;}
		.topbutton:active {top: 12px; box-shadow: 0px 1px 0px 0px #888;}
	</style>
</head>
<body ng-controller="BGCtrl" ng-cloak>
	<a class="corner topbutton" style="left: 25px;" href="../">&laquo; Hub</a>
	<div class="corner" style="right: 25px;">
		<a target="_blank" href="https://twitter.com/SteamTools"><img src="/img/twitter.png" alt="Twitter" width="25" height="25"></a>
		<a target="_blank" href="https://steamcommunity.com/groups/steam_tools"><img src="/img/steam.png" alt="Steam Group" width="25" height="25"></a>
		<a class="topbutton" id="feedback"  href="https://steamcommunity.com/groups/steam_tools">Feedback</a>
		<a class="topbutton" id="donate" href="https://www.paypal.com/donate/?business=HLRYRKCXRYX7C">Donate</a>
	</div>

	<div style="margin: 10px">
		<div style="display: inline-block; vertical-align: top; margin-top: 7px;">
			<a ng-href="{{steamLoginUrl}}" ng-if="!loggedIn">
				<img src='/img/steam_openid.png' alt="Sign in through Steam" width="114" height="43"/>
			</a>
			<button type="button" class="btn btn-primary" ng-click="openInventoryImporter()" style="margin-left: 6px; vertical-align: top;">Import Inventory</button>
			<button type="button" class="btn" ng-if="loggedIn" ng-click="userLogout()" style="margin-left: 4px; vertical-align: top;">Logout</button>
		</div>
		<div style="display: inline-block; margin: 0 15px">
			<b>Number of items:</b> {{(bg | filter:ownTest).length}}
			<br>
			<i role="status" aria-live="polite" aria-atomic="true">{{user_status}}</i>
			<span ng-show="loggedIn">
				(<a href="#" ng-click="$event.preventDefault(); reverseOwn=!reverseOwn">reverse</a>)
			</span>
		</div>
	</div>

	<div class="input-prepend" style="margin: 10px">
		<label for="bg-filter-input" class="add-on" style="width:50px;display:inline-block;margin-bottom:0;">Filter</label>
		<input id="bg-filter-input" class="span2" type="text" ng-model="filterText" ng-model-options="{debounce: 250}" autocorrect="off" autocapitalize="none" spellcheck="false">
	</div>
	<div class="input-prepend btn-group" style="margin: 10px">
		<span class="add-on" style="width:50px">Order</span>
		<button class="btn btn-inverse" ng-click="setOrder(byHue)">Hue</button>
		<button class="btn btn-inverse" ng-click="setOrder(byBrightness)">Brightness</button>
		<button class="btn btn-inverse" ng-click="setOrder(bySaturation)">Saturation</button>
		<button class="btn btn-inverse" ng-click="setOrder(byName)">Name</button>
		<button class="btn btn-inverse" ng-click="setOrder(byGame)">Game</button>
		<button class="btn btn-inverse" ng-click="setOrder(byDate)">Date</button>
		<button class="btn btn-inverse" ng-click="setOrder(byPrice)">Price</button>
		<button class="btn btn-inverse" ng-click="setOrder(byRandom)">Random</button>
	</div><br>
	<div style="width: 750px; margin: auto; margin-top: -12px" ng-show="showRange">
		<span style="font-weight: bold; font-size: 14pt">{{limits.type}}: </span>
		<div class="slider" range-slider min="0" max="100" model-min="limits.min" model-max="limits.max"></div>
		<span class="limits-label">{{limits.rangeLabel}}</span>
	</div>

	<div id="nn_lb1" style="margin: 10px auto 0 auto"></div>

	<div id="loading" ng-show="bg.length == 0">Loading...</div>

	<div id="items" ng-show="bg.length > 0" ng-style="{'width': divWidth}">
		<div class="bg" ng-repeat="b in bg | filter:ownTest | filter:filterText | orderBy:order:rev | range:limits | limitTo:numLines*itemsPerLine"
		ng-style="b.pos ? getStyle(b.pos) : null" title="{{b.name}}" ng-click="load(b, $event)">
			<img ng-if="!b.pos && b.img" class="bg-thumb" ng-src="{{ECON_URL + b.img + '/256fx160f'}}" width="256" height="160" loading="lazy" alt="{{b.name}}">
			<div class="name">{{b.name}}</div>
			<a target="_blank" rel="noopener noreferrer" ng-href="{{BASE_URL + b.url}}" class="market">{{b.price | currency}}</a>
		</div>
	</div>

	<script src="//code.jquery.com/jquery-2.2.0.min.js"></script>
	<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.3.6/angular.min.js"></script>
	<script src="ng-infinite-scroll.min.js"></script>
	<script src="angular.rangeSlider.js"></script>
	<script src="../js/steamtools-config.js?v=20261116b"></script>
	<script src="../js/import-worker.js?v=20261116b"></script>
	<script src="../js/steamtools-import.js?v=20261116b"></script>
	<script src="main.js?v=20261116b"></script>

		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)

	<script>

</body>
</html>
