<!doctype html>
<html lang="en" ng-app="BGApp">
<head>
	<!-- NetworkN -->
	<script async src="https://kumo.network-n.com/dist/app.js" site="steam-tools"></script>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Easily browse, filter and sort an up to date list of Steam backgrounds in one page.">
	<meta name="keywords" content="Steam,backgrounds,list,sort">
	<meta name="referrer" content="no-referrer-when-downgrade">
	<meta name="author" content="Ehsan Kia">
	<title>Background Gallery</title>
	<link rel="shortcut icon" href="/favicon.ico">
	<link href="https://netdna.bootstrapcdn.com/twitter-bootstrap/2.3.2/css/bootstrap-combined.no-icons.min.css" integrity="sha384-nITPVmSN/64KqhfcWtEJQwuzHIHqSgbSPmp74MISiB8zab+d6ThLyqTpw8bYMBqY" crossorigin="anonymous" rel="stylesheet">
	<link href="angular.rangeSlider.css?v=20261118b" rel="stylesheet">
	<link href="../css/steamtools-import.css?v=20261118b" rel="stylesheet">

	<style>
		body{text-align: center; padding-top: 10px; background-image: url(/img/bg.png); background-image: image-set(url("/img/bg.webp") type("image/webp"), url("/img/bg.png") type("image/png"));}
		:where(button, a, input, select, [tabindex]):focus-visible {
			outline: 2px solid #66c0f4;
			outline-offset: 2px;
		}
		#items {
			background-color: #222;
			border-radius: 5px;
			margin: auto;
			max-width: 100%;
			box-sizing: border-box;
			padding: 5px 0;
			margin-top: 10px;
			contain: layout style paint;
		}
		.market:hover{ background-color: rgba(200,255,200,0.6); }
		.bg:hover .market,
		.bg:focus-visible .market,
		.bg:focus-within .market { opacity: 1; }
		.bg:hover .name,
		.bg:focus-visible .name,
		.bg:focus-within .name { opacity: 1; }
		@media (hover: none) {
			.bg .market, .bg .name { opacity: 0.92; }
		}
		img{ transition: opacity 0.3s; }
		.bg{
			position: relative;
			overflow: hidden;
			margin: 5px;
			width: 256px;
			height: 160px;
			display: inline-block;
			vertical-align: top;
			content:' ';
			cursor: pointer;
		}
		.bg-thumb {
			position: absolute;
			left: 0;
			top: 0;
			width: 256px;
			height: 160px;
			object-fit: cover;
			z-index: 0;
		}
		.market {
			position: relative;
			z-index: 2;
			opacity: 0;
			display: block;
			width: 80px;
			height: 28px;
			margin: auto;
			background-color: rgba(255,255,255,0.5);
			transition: opacity 0.2s;
			text-decoration: none;
			font-size: 20px;
			color: #222;
			line-height: 30px;
			margin-top: 120px;
		}

		.name {
			position: relative;
			z-index: 2;
			opacity: 0;
			width: 200px;
			padding: 3px;
			margin-top: 15px;
			transition: opacity 0.2s;
			background-color: rgba(255,255,255,0.5);
			float: left;
			margin-left: 25px;
		}
		dialog.st-bg-lightbox {
			padding: 12px;
			border: 1px solid #444;
			border-radius: 8px;
			background: #14181d;
			color: #fff;
			max-width: min(92vw, 1280px);
			max-height: 90dvh;
			margin: auto;
		}
		dialog.st-bg-lightbox[open] {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			gap: 8px;
		}
		dialog.st-bg-lightbox:modal {
			overscroll-behavior: contain;
		}
		dialog.st-bg-lightbox::backdrop {
			background: rgba(0, 0, 0, 0.8);
			overflow: hidden;
			overscroll-behavior: contain;
		}
		dialog.st-bg-lightbox img {
			max-width: 100%;
			max-height: calc(90dvh - 64px);
			display: block;
		}

		#help {
			width: min(675px, 100%);
			max-width: 100%;
			box-sizing: border-box;
			padding: 8px;
			background-color: #CCC;
			border: 4px double #333;
			margin: auto;
			margin-bottom: 10px;
			font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
			text-align: left;
		}
		#loading {
			width: 200px;
			text-align: center;
			margin: auto;
			font-size: 14pt;
			font-weight: bold;
			color: #333;
			padding: 10px;
		}
		.corner {
			position: absolute;
			opacity: 0.85;
			z-index: 10;
			top: 10px;
			display: inline-flex;
			align-items: center;
			gap: 4px;
		}
		.topbutton {
			color: #159;
			display: inline-block;
			font-weight: bold;
			font-size: 12pt;
			color: #159;
			background-color: #CCC;
			padding: 2px 8px;
			border-radius: 3px;
			box-shadow: 0px 3px 0px 0px #888;
			border: 1px solid #666;
			width: 75px;
			text-align: center;
			margin: 0 3px;
			box-sizing: content-box;
		}
		.gallery-top-bar {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 12px;
			margin: 10px auto;
			padding: 0 8px;
		}
		.gallery-auth-actions {
			display: inline-flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}
		.st-bar-group {
			display: inline-flex;
			flex-wrap: wrap;
			align-items: stretch;
			justify-content: center;
			vertical-align: middle;
			margin: 5px;
		}
		.st-bar-group > .add-on {
			height: 30px;
			box-sizing: border-box;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			margin: 0;
			border-radius: 4px 0 0 4px;
		}
		.st-bar-group > input {
			height: 30px;
			box-sizing: border-box;
			margin: 0;
			border-radius: 0 4px 4px 0;
		}
		.st-bar-group > .btn {
			float: none;
			height: 30px;
			box-sizing: border-box;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border-radius: 0;
			margin-left: -1px;
		}
		.st-bar-group > .btn:last-child {
			border-radius: 0 4px 4px 0;
		}
		.range-row {
			width: min(820px, 100%);
			box-sizing: border-box;
			padding: 0 4px;
			margin: 8px auto 14px;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: 10px;
		}
		.range-title {
			min-width: 115px;
			text-align: right;
			font-weight: bold;
			font-size: 14pt;
		}
		.slider {
			display: inline-block;
			width: min(460px, 100%);
		}
		.slider.ngrs-range-slider {
			margin: 4px 0 22px;
		}
		@media (max-width: 1180px) {
			body { padding-top: 48px; }
		}
		@media (max-width: 768px) {
			body { padding-top: 48px; }
			.btn-group { white-space: normal; max-width: 100%; }
			.range-title, .limits-label { min-width: 0; text-align: center; }
		}
		@media (max-width: 480px) {
			.corner {
				max-width: calc(100vw - 8px);
				gap: 4px;
			}
			.corner.topbutton,
			.corner .topbutton {
				width: auto;
				min-width: 0;
				font-size: 11px;
				line-height: 1.2;
				padding: 3px 6px;
				margin: 0 2px;
			}
		}
		.limits-label {
			min-width: 155px;
			text-align: left;
			font-weight: bold;
			white-space: nowrap;
		}
		.corner img:hover {opacity: 0.8;}
		.topbutton:hover {background-color: #CDE; text-decoration: none;}
		.topbutton:active {top: 12px; box-shadow: 0px 1px 0px 0px #888;}
	</style>
</head>
<body ng-controller="BGCtrl" ng-cloak>
	<a class="corner topbutton" style="left: 25px;" href="../">&laquo; Hub</a>
	<div class="corner" style="right: 25px;">
		<a target="_blank" rel="noopener noreferrer" href="https://twitter.com/SteamTools"><img src="/img/twitter.png" alt="Twitter" width="25" height="25"></a>
		<a target="_blank" rel="noopener noreferrer" href="https://steamcommunity.com/groups/steam_tools"><img src="/img/steam.png" alt="Steam Group" width="25" height="25"></a>
		<a class="topbutton" id="feedback"  href="https://steamcommunity.com/groups/steam_tools">Feedback</a>
		<a class="topbutton" id="donate" href="https://www.paypal.com/donate/?business=HLRYRKCXRYX7C">Donate</a>
	</div>

	<div class="gallery-top-bar">
		<div class="gallery-auth-actions">
			<a ng-href="{{steamLoginUrl}}" ng-if="!loggedIn">
				<img src='/img/steam_openid.png' alt="Sign in through Steam" width="114" height="43"/>
			</a>
			<button type="button" class="btn btn-primary" ng-click="openInventoryImporter()">Import from Steam</button>
			<button type="button" class="btn" ng-if="loggedIn" ng-click="userLogout()">Logout</button>
		</div>
		<div class="gallery-auth-status">
			<b>Number of items:</b> {{filteredItems.length}}
			<br>
			<i role="status" aria-live="polite" aria-atomic="true">{{user_status}}</i>
			<span ng-show="loggedIn">
				(<a href="#" ng-click="$event.preventDefault(); reverseOwn=!reverseOwn">reverse</a>)
			</span>
		</div>
	</div>

	<div class="st-bar-group input-prepend">
		<label for="bg-filter-input" class="add-on" style="width:50px;">Filter</label>
		<input id="bg-filter-input" class="span2" type="text" ng-model="filterText" ng-model-options="{debounce: 250}" autocorrect="off" autocapitalize="none" spellcheck="false">
	</div>
	<div class="st-bar-group input-prepend btn-group">
		<span class="add-on" style="width:50px">Order</span>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byHue}" aria-pressed="{{order === byHue}}" ng-click="setOrder(byHue)">Hue</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byBrightness}" aria-pressed="{{order === byBrightness}}" ng-click="setOrder(byBrightness)">Brightness</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === bySaturation}" aria-pressed="{{order === bySaturation}}" ng-click="setOrder(bySaturation)">Saturation</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byName}" aria-pressed="{{order === byName}}" ng-click="setOrder(byName)">Name</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byGame}" aria-pressed="{{order === byGame}}" ng-click="setOrder(byGame)">Game</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byDate}" aria-pressed="{{order === byDate}}" ng-click="setOrder(byDate)">Date</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byPrice}" aria-pressed="{{order === byPrice}}" ng-click="setOrder(byPrice)">Price</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byRandom}" aria-pressed="{{order === byRandom}}" ng-click="setOrder(byRandom)">Random</button>
	</div>
	<div class="range-row" ng-show="showRange">
		<span class="range-title">{{limits.type}}:</span>
		<div class="slider" range-slider min="0" max="100" model-min="limits.min" model-max="limits.max" on-handle-up="flushRangeFilter()"></div>
		<span class="limits-label">{{limits.rangeLabel}}</span>
	</div>

	<div id="nn_lb1" style="margin: 10px auto 0 auto"></div>

	<div id="loading" ng-show="bg.length == 0">Loading...</div>

	<div id="items" ng-show="bg.length > 0" ng-style="{'width': divWidth}">
		<div class="bg" role="button" tabindex="0" aria-label="Preview {{::b.name}}" ng-repeat="b in filteredItems | limitTo:(numLines*itemsPerLine) track by b.url"
		ng-style="::b._style" title="{{::b.name}}" ng-click="load(b, $event)" ng-keydown="onTileKeydown(b, $event)" ng-keyup="onTileKeyup(b, $event)">
			<img ng-if="::(!b.pos && b.img)" class="bg-thumb" ng-src="{{::(ECON_URL + b.img + '/256fx160f')}}" width="256" height="160" loading="lazy" alt="{{::b.name}}">
			<div class="name">{{::b.name}}</div>
			<a target="_blank" rel="noopener noreferrer" ng-href="{{::(BASE_URL + b.url)}}" class="market">{{formatPrice(b.price)}}</a>
		</div>
	</div>
	<div id="scroll-sentinel" aria-hidden="true" style="height: 1px;"></div>

	<script src="https://code.jquery.com/jquery-2.2.0.min.js" integrity="sha384-K+ctZQ+LL8q6tP7I94W+qzQsfRV2a+AfHIi9k8z8l9ggpc8X+Ytst4yBo/hH+8Fk" crossorigin="anonymous"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.6/angular.min.js" integrity="sha384-Wm/fcldF74JKp+X609mkWQUjA/AsRbY2zqUhRjznliDz924gK7f19e8nOcxVVDof" crossorigin="anonymous"></script>
	<script src="angular.rangeSlider.js?v=20261118b"></script>
	<script src="../js/steamtools-config.js?v=20261118b"></script>
	<script src="../js/import-worker.js?v=20261118b"></script>
	<script src="../js/steamtools-import.js?v=20261118b"></script>
	<script src="main.js?v=20261118b"></script>

	<!-- Start of StatCounter Code for Default Guide -->
	<script>
		var sc_project=9905430;
		var sc_invisible=1;
		var sc_security="89ce89e8";
	</script>
	<script async src="https://secure.statcounter.com/counter/counter.js"></script>
	<noscript><div class="statcounter"><a title="create counter"
	href="https://statcounter.com/free-hit-counter/"
	target="_blank" rel="noopener noreferrer"><img class="statcounter"
	src="https://c.statcounter.com/9905430/0/89ce89e8/1/"
	alt="create counter" width="1" height="1"></a></div></noscript>
	<!-- End of StatCounter Code for Default Guide -->

</body>
</html>
