name: Frontend Parity CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/parity.test.js
