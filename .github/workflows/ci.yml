name: Frontend Parity CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: v2-src/package-lock.json
      - run: npm --prefix v2-src ci
      - run: npm --prefix v2-src run check
      - run: npm --prefix v2-src run build
      - run: node --test tests/parity.test.js tests/v2.test.js
