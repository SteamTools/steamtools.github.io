<!doctype html>
<html lang="en" ng-app="EmoteApp">
<head>
	<!-- NetworkN -->
	<script async src="https://kumo.network-n.com/dist/app.js" site="steam-tools"></script>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Easily browse, filter and sort an up to date list of Steam emoticons in one page.">
	<meta name="keywords" content="Steam,emoticons,list,sort">
	<meta name="referrer" content="no-referrer-when-downgrade">
	<meta name="author" content="Ehsan Kia">
	<title>Emoticon Gallery</title>
	<link rel="shortcut icon" href="/favicon.ico">
	<link href="https://netdna.bootstrapcdn.com/twitter-bootstrap/2.3.2/css/bootstrap-combined.no-icons.min.css" integrity="sha384-nITPVmSN/64KqhfcWtEJQwuzHIHqSgbSPmp74MISiB8zab+d6ThLyqTpw8bYMBqY" crossorigin="anonymous" rel="stylesheet">
	<link href="angular.rangeSlider.css?v=20261116f" rel="stylesheet">
	<link href="../css/steamtools-import.css?v=20261116f" rel="stylesheet">

	<style>
		body{
			background-image: url(/img/bg.png);
			text-align: center;
			padding-top: 10px;
		}
		:where(button, a, input, select, [tabindex]):focus-visible {
			outline: 2px solid #66c0f4;
			outline-offset: 2px;
		}
		.box{
			margin: 10px 5px;
			display: inline-block;
			vertical-align: top;
			color: #ccc;
			font-size: 10px;
			text-align: center;

		}
		.emote{
			content:' ';
			width: 64px;
			height: 64px;
			display: block;
			margin: -2px auto;
		}

		.small {
			width: 18px;
			height: 18px;
		}

		#help {
			width: min(675px, calc(100vw - 16px));
			max-width: 100%;
			box-sizing: border-box;
			padding: 8px;
			background-color: #CCC;
			border: 4px double #333;
			margin: auto;
			margin-bottom: 10px;
			font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
			text-align: left;
		}
		#loading {
			width: 200px;
			text-align: center;
			margin: auto;
			font-size: 14pt;
			font-weight: bold;
			color: #333;
			padding: 10px;
		}
		#items {
			background-color: #222;
			border-radius: 5px;
			margin: auto;
			max-width: calc(100vw - 16px);
			box-sizing: border-box;
			padding: 5px 0;
			margin-top: 10px;
		}
		.corner {
			position: absolute;
			opacity: 0.8;
			z-index: 10;
			top: 10px;
		}
		.topbutton {
			display: inline-block;
			font-weight: bold;
			font-size: 12pt;
			color: #159;
			background-color: #CCC;
			padding: 2px 8px;
			border-radius: 3px;
			box-shadow: 0px 3px 0px 0px #888;
			border: 1px solid #666;
			width: 75px;
			text-align: center;
			margin: 0 3px;
		}
		.slider {
			display: inline-block;
			width: min(500px, 85vw);
			margin-bottom: -7px;
		}
		@media (max-width: 768px) {
			body { padding-top: 48px; }
			.btn-group { white-space: normal; max-width: 100%; }
		}
		.limits-label {
			vertical-align: text-bottom;
			margin-left: 3px;
			font-weight: bold;
		}
		.corner img:hover {opacity: 0.8;}
		.topbutton:hover {background-color: #CDE; text-decoration: none;}
		.topbutton:active {top: 12px; box-shadow: 0px 1px 0px 0px #888;}
	</style>
</head>
<body ng-controller="EmoteCtrl" ng-cloak>
	<a class="corner topbutton" style="left: 25px;" href="../">&laquo; Hub</a>
	<div class="corner" style="right: 25px;">
		<a target="_blank" rel="noopener noreferrer" href="https://twitter.com/SteamTools"><img src="/img/twitter.png" alt="Twitter" width="25" height="25"></a>
		<a target="_blank" rel="noopener noreferrer" href="https://steamcommunity.com/groups/steam_tools"><img src="/img/steam.png" alt="Steam Group" width="25" height="25"></a>
		<a class="topbutton" id="feedback"  href="https://steamcommunity.com/groups/steam_tools">Feedback</a>
		<a class="topbutton" id="donate" href="https://www.paypal.com/donate/?business=HLRYRKCXRYX7C">Donate</a>
	</div>

	<div style="margin: 10px">
		<div style="display: inline-block; vertical-align: top; margin-top: 7px;">
			<a ng-href="{{steamLoginUrl}}" ng-if="!loggedIn">
				<img src='/img/steam_openid.png' alt="Sign in through Steam" width="114" height="43"/>
			</a>
			<button type="button" class="btn btn-primary" ng-click="openInventoryImporter()" style="margin-left: 6px; vertical-align: top;">Import Inventory</button>
			<button type="button" class="btn" ng-if="loggedIn" ng-click="userLogout()" style="margin-left: 4px; vertical-align: top;">Logout</button>
		</div>
		<div style="display: inline-block; margin: 0 15px">
			<b>Number of items:</b> {{filteredItems.length}}
			<br>
			<i role="status" aria-live="polite" aria-atomic="true">{{user_status}}</i>
			<span ng-show="loggedIn">
				(<a href="#" ng-click="$event.preventDefault(); reverseOwn=!reverseOwn">reverse</a>)
			</span>
		</div>
	</div>

	<div class="input-prepend" style="margin: 5px; display: inline-block">
		<label for="emote-filter-input" class="add-on" style="width:50px;display:inline-block;margin-bottom:0;">Filter</label>
		<input id="emote-filter-input" class="span2" type="text" ng-model="filterText" ng-model-options="{debounce: 250}" autocorrect="off" autocapitalize="none" spellcheck="false" />
	</div>

	<div style="display: inline-block; margin: 5px;" class="input-prepend btn-group">
		<span class="add-on" style="width:50px">Order</span>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byHue}" aria-pressed="{{order === byHue}}" ng-click="setOrder(byHue)">Hue</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byBrightness}" aria-pressed="{{order === byBrightness}}" ng-click="setOrder(byBrightness)">Brightness</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === bySaturation}" aria-pressed="{{order === bySaturation}}" ng-click="setOrder(bySaturation)">Saturation</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byName}" aria-pressed="{{order === byName}}" ng-click="setOrder(byName)">Name</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byGame}" aria-pressed="{{order === byGame}}" ng-click="setOrder(byGame)">Game</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byDate}" aria-pressed="{{order === byDate}}" ng-click="setOrder(byDate)">Date</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byPrice}" aria-pressed="{{order === byPrice}}" ng-click="setOrder(byPrice)">Price</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byLength}" aria-pressed="{{order === byLength}}" ng-click="setOrder(byLength)">Name Length</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: order === byRandom}" aria-pressed="{{order === byRandom}}" ng-click="setOrder(byRandom)">Random</button>
	</div><br>
	<div style="width: min(750px, 100%); margin: auto;" ng-show="showRange">
		<span style="font-weight: bold; font-size: 14pt">{{limits.type}}: </span>
		<div class="slider" range-slider min="0" max="100" model-min="limits.min" model-max="limits.max"></div>
		<span class="limits-label">{{limits.rangeLabel}}</span>
	</div>

	<div style="display: inline-block; margin: 5px" class="input-prepend btn-group">
		<span class="add-on" style="width:50px">Toggle</span>
		<button type="button" class="btn btn-inverse" ng-class="{active: names}" aria-pressed="{{!!names}}" ng-click="names=!names">Name</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: small}" aria-pressed="{{!!small}}" ng-click="small=!small">Size</button>
		<button type="button" class="btn btn-inverse" ng-class="{active: date}" aria-pressed="{{!!date}}" ng-click="date=!date">Date</button>
	</div>

	<br>

	<div id="nn_lb1" style="margin: 5px auto 0 auto"></div>

	<div id="loading" ng-if="emotes.length == 0">Loading...</div>

	<div id="items"	ng-if="emotes.length > 0" ng-style="{'width': divWidth}">
		<div ng-repeat="e in filteredItems | limitTo:(numLines*itemsPerLine) track by e.url" title="{{e.name}}" class="box">
			<span ng-show="date" style="font-size: 8px">{{e.date}}</span>
			<a class="emote" ng-class="{small: small}" ng-style="e.pos ? getStyle(e.pos) : null" ng-href="{{BASE_URL + e.url}}" target="_blank" rel="noopener noreferrer">
				<img ng-if="!e.pos" ng-src="{{getEmoteImgSrc(e)}}" width="64" height="64" ng-attr-width="{{small ? 18 : 64}}" ng-attr-height="{{small ? 18 : 64}}" loading="lazy" alt="{{e.name}}" style="width:100%;height:100%;object-fit:contain;">
			</a>
			<span ng-show="names">{{e.name}}</span>
		</div>
	</div>
	<div id="scroll-sentinel" aria-hidden="true" style="height: 1px;"></div>

	<script src="https://code.jquery.com/jquery-2.2.0.min.js" integrity="sha384-K+ctZQ+LL8q6tP7I94W+qzQsfRV2a+AfHIi9k8z8l9ggpc8X+Ytst4yBo/hH+8Fk" crossorigin="anonymous"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.6/angular.min.js" integrity="sha384-Wm/fcldF74JKp+X609mkWQUjA/AsRbY2zqUhRjznliDz924gK7f19e8nOcxVVDof" crossorigin="anonymous"></script>
	<script src="angular.rangeSlider.js"></script>
	<script src="../js/steamtools-config.js?v=20261116f"></script>
	<script src="../js/import-worker.js?v=20261116f"></script>
	<script src="../js/steamtools-import.js?v=20261116f"></script>
	<script src="main.js?v=20261116f"></script>

	<!-- Start of StatCounter Code for Default Guide -->
	<script>
		var sc_project=9905430;
		var sc_invisible=1;
		var sc_security="89ce89e8";
	</script>
	<script async src="https://secure.statcounter.com/counter/counter.js"></script>
	<noscript><div class="statcounter"><a title="create counter"
	href="https://statcounter.com/free-hit-counter/"
	target="_blank" rel="noopener noreferrer"><img class="statcounter"
	src="https://c.statcounter.com/9905430/0/89ce89e8/1/"
	alt="create counter" width="1" height="1"></a></div></noscript>
	<!-- End of StatCounter Code for Default Guide -->

</body>
</html>
